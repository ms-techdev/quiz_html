<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & Web-Grundlagen Quiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --correct-color: #22c55e;
            --incorrect-color: #ef4444;
            --button-hover: #0284c7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .progress {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question {
            font-size: 1.25rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .btn {
            background-color: #334155;
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn:hover:not([disabled]) {
            background-color: #475569;
            border-color: var(--accent-color);
        }

        .btn.correct {
            background-color: var(--correct-color);
            color: #fff;
        }

        .btn.incorrect {
            background-color: var(--incorrect-color);
            color: #fff;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #0f172a;
            border-left: 4px solid var(--accent-color);
            display: none;
            line-height: 1.5;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn, .restart-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: var(--button-hover);
            color: #fff;
        }

        .score-container {
            text-align: center;
        }

        .score-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .score-number {
            font-size: 3rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz">
    <div class="progress" id="progress">Frage 1 von 20</div>
    <div class="question" id="question">Frage wird geladen...</div>
    <div class="options-grid" id="options"></div>
    <div class="explanation" id="explanation"></div>
    <div class="controls">
        <button class="next-btn" id="next-btn" onclick="nextQuestion()" style="display: none;">Nächste Frage</button>
    </div>
</div>

<script>
const quizData = [
    {
        question: "Welche Aussage zu HTML trifft zu?",
        options: [
            "HTML ist eine höhere Programmiersprache.",
            "HTML ist eine Auszeichnungssprache zur Strukturierung von Webseiten.",
            "HTML wird vom Webserver ausgeführt.",
            "HTML dient zur Datenbankabfrage."
        ],
        correct: 1,
        explanation: "HTML (Hypertext Markup Language) ist eine Auszeichnungssprache, kein Programmcode. Sie wird direkt vom Browser interpretiert."
    },
    {
        question: "Welches HTML-Element stellt die Hauptüberschrift einer Seite dar?",
        options: ["<heading>", "<h6>", "<h1>", "<head>"],
        correct: 2,
        explanation: "<h1> kennzeichnet die wichtigste Überschrift erster Ordnung auf einer Webseite."
    },
    {
        question: "Welches Attribut wird verwendet, um das Ziel eines Hyperlinks anzugeben?",
        options: ["src", "href", "link", "target"],
        correct: 1,
        explanation: "Das Attribute 'href' (Hypertext Reference) gibt die Ziel-URL an: <a href='...'>"
    },
    {
        question: "Welches Dateiformat eignet sich am besten für ein komplexes Foto mit feinen Farbverläufen auf einer Website?",
        options: ["GIF", "JPEG", "PNG-8", "BMP"],
        correct: 1,
        explanation: "JPEG nutzt komprimierte Rastergrafiken, die speziell für Fotos mit feinen Farbverläufen optimiert sind."
    },
    {
        question: "Ein animiertes Schema soll auf einer Webseite eingebunden werden. Welches Format nutzt man dafür?",
        options: ["JPEG", "GIF", "PNG", "PDF"],
        correct: 1,
        explanation: "GIF unterstützt einfache Bildsequenzen und wird von allen Browsern nativ für kurze Animationen dargestellt."
    },
    {
        question: "Welche Angabe zur 'Auflösung' ist für Pixel-Bilder bei der Veröffentlichung auf Webseiten entscheidend?",
        options: [
            "Die feste PPI-Einstellung von exakt 300 ppi",
            "Die Pixelabmessungen (z. B. 800×600 px)",
            "Die Farbtiefe von mindestens 64 Bit",
            "Die DPI-Zahl im Druckmenü"
        ],
        correct: 1,
        explanation: "Im Web zählen primär die tatsächlichen Pixelabmessungen. PPI/DPI stammen aus dem Druckbereich."
    },
    {
        question: "Wie lautet die korrekte relative Verlinkung zur Datei 'seite_it.html' im Unterordner 'seiten'?",
        options: [
            "href='seiten/seite_it.html'",
            "href='/seite_it.html'",
            "href='../seite_it.html'",
            "href='http://seiten/seite_it.html'"
        ],
        correct: 0,
        explanation: "'seiten/seite_it.html' verweist direkt aus dem aktuellen Ordner in das Unterverzeichnis 'seiten'."
    },
    {
        question: "Was sollte bei der Vergabe von Dateinamen für notwendige Webdateien vermieden werden?",
        options: [
            "Die Verwendung von Bindestrichen",
            "Großbuchstaben, Leerzeichen und Umlaute",
            "Aussagestarke Namen wie kontakt.html",
            "Ausschließliche Verwendung von Kleinschreibung"
        ],
        correct: 1,
        explanation: "Großbuchstaben verursachen Pfadfehler auf Linux-Servern. Leerzeichen und Umlaute führen zu Codierungsproblemen in URLs."
    },
    {
        question: "Warum ist das absolute Verlinken eigener interner Seiten unzweckmäßig?",
        options: [
            "Weil absolute Links im Browser langsamer laden.",
            "Weil der Code bei einem Domainwechsel oder beim lokalen Testen bricht.",
            "Weil HTML keine absoluten Links unterstützt.",
            "Weil Suchmaschinen absolute Links generell ignorieren."
        ],
        correct: 1,
        explanation: "Absolute Links enthalten die volle Domain. Bei Serverumzügen oder lokalem Testen verweisen sie weiterhin auf die alte Webadresse."
    },
    {
        question: "Wann SOLLTEN absolute Links verwendet werden?",
        options: [
            "Für alle Links im Hauptmenü einer Website.",
            "Beim Verlinken auf externe Webseiten Dritter.",
            "Für die Einbindung lokaler Stylesheets.",
            "Niemals, da sie in HTML unzulässig sind."
        ],
        correct: 1,
        explanation: "Für fremde, externe Webseiten muss die vollständige URL (inkl. https://) angegeben werden."
    },
    {
        question: "In welche zwei Hauptteile wird ein HTML-Dokument grundlegend aufgeteilt?",
        options: [
            "<header> und <footer>",
            "<head> und <body>",
            "<title> und <meta>",
            "<top> und <bottom>"
        ],
        correct: 1,
        explanation: "<head> enthält unsichtbare Metadaten und Titel, <body> den gesamten sichtbaren Inhalt."
    },
    {
        question: "Welche der folgenden Aufgaben gehört NICHT zu den Hauptfunktionen des <title>-Tags?",
        options: [
            "Anzeige im Tab/Fensterkopf des Browsers",
            "Darstellung als Hauptüberschrift in Google-Suchergebnissen",
            "Automatisches Auslesen als Hauptüberschrift (H1) im Textbereich",
            "Standardname beim Speichern eines Lesezeichens"
        ],
        correct: 2,
        explanation: "Der <title> wird nicht im Inhaltsbereich der Webseite dargestellt. Dafür ist das <h1>-Tag im <body> zuständig."
    },
    {
        question: "Wie verändert sich die theoretische Übertragungszeit einer 300 KB Seite von einem 56 kbit/s Modem zu einem 500 Mbit/s DSL-Anschluss?",
        options: [
            "Von ca. 43 Sekunden auf unter 0,01 Sekunden",
            "Von ca. 5 Sekunden auf 1 Sekunde",
            "Gar nicht, da die Seitengröße gleich bleibt",
            "Von 37,5 Sekunden auf 1 Sekunde"
        ],
        correct: 0,
        explanation: "300 KB (2.400 kbit) dauern bei 56 kbit/s ca. 42,8 Sek. Bei 500 Mbit/s (500.000 kbit/s) schrumpft die Zeit rein rechnerisch auf 0,0048 Sek."
    },
    {
        question: "Was ist der Hauptzweck einer Image-Map (<img> mit <map>)?",
        options: [
            "Bilder automatisch für Mobilgeräte zu verkleinern",
            "Verschiedene anklickbare Link-Bereiche auf einem einzigen Bild zu definieren",
            "Ein Bild als interaktive Google-Map zu laden",
            "Mehrere Bilder zu einer Diashow zusammenzufügen"
        ],
        correct: 1,
        explanation: "Mit Image-Maps definiert man geometrische Zonen (Rechtecke, Kreise, Polygone) auf einem Bild, die zu unterschiedlichen Zielen verlinken."
    },
    {
        question: "Was zeichnet eine verlustfreie Komprimierung (z. B. bei PNG oder GIF) aus?",
        options: [
            "Dateien werden extrem klein, verlieren aber sichtbar an Auflösung.",
            "Nach dem Dekomprimieren sind die Daten exakt identisch mit dem Original.",
            "Sie funktioniert ausschließlich bei Videodateien.",
            "Daten werden gelöscht, die das menschliche Auge nicht wahrnimmt."
        ],
        correct: 1,
        explanation: "Bei verlustfreier Komprimierung gehen keinerlei Informationen verloren. Das Original wird beim Öffnen zu 100 % wiederhergestellt."
    },
    {
        question: "Welches der folgenden Formate verwendet eine verlustbehaftete Komprimierung?",
        options: ["PNG", "ZIP", "JPEG", "GIF"],
        correct: 2,
        explanation: "JPEG verwirft feine Farbinformationen (verlustbehaftet), um Fotos stark zu verkleinern. PNG, GIF und ZIP komprimieren verlustfrei."
    },
    {
        question: "Welches HTML-Element stellt eine LOGISCHE Textauszeichnung dar?",
        options: ["<b>", "<i>", "<strong>", "<u>"],
        correct: 2,
        explanation: "<strong> bedeutet semantisch 'starke Bedeutung' (logisch). <b>, <i> und <u> bestimmen nur das visuelle Erscheinungsbild (physisch)."
    },
    {
        question: "Welches HTML-Element ist eine rein PHYSISCHE Textauszeichnung zur Tiefstellung?",
        options: ["<sub>", "<sup>", "<em>", "<code>"],
        correct: 0,
        explanation: "<sub> (Subscript) stellt Text tief (z.B. H₂O). Es beschreibt nur die visuelle Lage, nicht die inhaltliche Bedeutung."
    },
    {
        question: "Warum soll die logische Textauszeichnung (z. B. <strong>) der physischen (z. B. <b>) vorgezogen werden?",
        options: [
            "Weil physische Tags von modernen Browsern nicht mehr unterstützt werden.",
            "Für Barrierefreiheit (Screenreader) und bessere Auswertung durch Suchmaschinen.",
            "Weil logische Tags den Text automatisch farbig markieren.",
            "Weil physische Tags mehr Speicherplatz benötigen."
        ],
        correct: 1,
        explanation: "Screenreader betonen logische Elemente akustisch für Sehbehinderte. Zudem verstehen Suchmaschinen-Crawler die Inhaltsgewichtung."
    },
    {
        question: "Welche Aufgabe hat das Common Gateway Interface (CGI)?",
        options: [
            "Es verbindet den Webbrowser direkt mit dem WLAN-Router.",
            "Es dient als Schnittstelle zwischen Webserver und externen Programmen zur Dynamisierung.",
            "Es verschlüsselt die Datenübertragung per HTTPS.",
            "Es speichert HTML-Dateien im Browser-Cache."
        ],
        correct: 1,
        explanation: "CGI erlaubt es Webservern, Anfragen an externe Skripte (z. B. Python, Perl) weiterzuleiten, um dynamische Antworten zu generieren."
    }
];

let currentQuestion = 0;
let score = 0;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const explanationEl = document.getElementById("explanation");
const nextBtn = document.getElementById("next-btn");
const progressEl = document.getElementById("progress");

function loadQuestion() {
    const currentQuiz = quizData[currentQuestion];
    progressEl.textContent = `Frage ${currentQuestion + 1} von ${quizData.length}`;
    questionEl.textContent = currentQuiz.question;
    optionsEl.innerHTML = "";
    explanationEl.style.display = "none";
    nextBtn.style.display = "none";

    currentQuiz.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.classList.add("btn");
        button.textContent = option;
        button.onclick = () => selectOption(index);
        optionsEl.appendChild(button);
    });
}

function selectOption(selectedIndex) {
    const currentQuiz = quizData[currentQuestion];
    const buttons = optionsEl.querySelectorAll(".btn");

    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === currentQuiz.correct) {
            btn.classList.add("correct");
        }
    });

    if (selectedIndex === currentQuiz.correct) {
        score++;
    } else {
        buttons[selectedIndex].classList.add("incorrect");
    }

    explanationEl.textContent = currentQuiz.explanation;
    explanationEl.style.display = "block";
    nextBtn.style.display = "block";
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showScore();
    }
}

function showScore() {
    const quizEl = document.getElementById("quiz");
    quizEl.innerHTML = `
        <div class="score-container">
            <div class="score-title">Quiz beendet!</div>
            <div class="score-number">${score} / ${quizData.length}</div>
            <p>Du hast ${Math.round((score / quizData.length) * 100)}% der Fragen richtig beantwortet.</p>
            <button class="restart-btn" onclick="location.reload()">Quiz neu starten</button>
        </div>
    `;
}

loadQuestion();
</script>
</body>
</html>
